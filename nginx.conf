# Listens on 4444 as well as 80 so the container answers whichever port
# Coolify's proxy and health check were configured with.
server {
    listen 80;
    listen 4444;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # The static export writes the OG card without an extension.
    location = /opengraph-image {
        default_type image/png;
    }

    error_page 404 /404.html;
}
